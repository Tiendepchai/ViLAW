version: "3.8"

networks:
  vilaw-net:
    driver: bridge

volumes:
  ollama:

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [vilaw-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    networks: [vilaw-net]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    stop_grace_period: 120s
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "4"

  ingestor:
    build: services/ingestor
    env_file: .env
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./indexes:/app/indexes
      - ./shared:/app/shared:ro
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8081:8081"
    networks: [vilaw-net]
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  worker:
    build: services/worker
    env_file: .env
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./indexes:/app/indexes
      - ./shared:/app/shared:ro
    depends_on:
      redis:
        condition: service_healthy
    networks: [vilaw-net]
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2"

  api:
    build: services/api
    env_file: .env
    restart: unless-stopped
    volumes:
      - ./data:/app/data:ro
      - ./indexes:/app/indexes
      - ./shared:/app/shared:ro
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks: [vilaw-net]
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2"

  updater:
    build: services/updater
    env_file: .env
    restart: unless-stopped
    depends_on:
      ingestor:
        condition: service_started
    networks: [vilaw-net]
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.3"
